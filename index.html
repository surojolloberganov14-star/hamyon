/* telefon ekrani: yuqoridagi soat qatori ostidan boshlanadi */
.wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}
html,body{overscroll-behavior-y:none}
/* ekran o'z-o'zidan kattalashib-kichraymasligi uchun: ikki marta bosish va qisib kattalashtirish o'chirilgan */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.onb-c{max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.onb-c img{border-radius:18px}
.onb-c h1{font:700 22px/1.2 var(--display);margin:6px 0 0;color:var(--ink)}
.onb-c p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.onb-c button{width:100%;padding:14px;font-size:15px}
.onb-c .pri{margin-top:8px}

<script>/* Telefon uchun mustaqil versiya: ma'lumotlar shu telefonning xotirasida (localStorage).
   Ilova kodi o'zgarmaydi: u claude.use('db') orqali shu ombor bilan ishlaydi. */
const LocalDB=(()=>{
  const KEY='surojbek-db',BK='surojbek-lastbk';
  let store=new Map();
  try{const raw=localStorage.getItem(KEY);if(raw)store=new Map(Object.entries(JSON.parse(raw)));}catch(e){}
  const subs=new Set();
  const clone=d=>d==null?d:JSON.parse(JSON.stringify(d));
  const meta={fromCache:false,hasPendingWrites:false};
  const save=()=>{localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(store)));};
  const commit=()=>{save();subs.forEach(f=>{try{f()}catch(e){console.error(e)}});};
  const snapDoc=p=>({id:p.split('/').pop(),exists:store.has(p),data:()=>clone(store.get(p)),metadata:meta});
  const depth=c=>c.split('/').length;
  const colDocs=c=>[...store.keys()].filter(k=>k.startsWith(c+'/')&&depth(k)===depth(c)+1).map(snapDoc);
  const colSnap=c=>{const docs=colDocs(c);return {docs,size:docs.length,empty:!docs.length,metadata:meta};};
  const docRef=p=>({id:p.split('/').pop(),path:p,
    get:async()=>snapDoc(p),
    set:async d=>{store.set(p,clone(d));commit();},
    update:async d=>{store.set(p,{...(store.get(p)||{}),...clone(d)});commit();},
    delete:async()=>{store.delete(p);commit();},
    onSnapshot:cb=>{const f=()=>cb(snapDoc(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}});
  const colRef=c=>({path:c,
    doc:id=>docRef(c+'/'+(id||Date.now().toString(36)+Math.random().toString(36).slice(2,8))),
    get:async()=>colSnap(c),
    onSnapshot:cb=>{const f=()=>cb(colSnap(c));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}});
  const exportObj=()=>({app:'surojbek-hamyoni',v:1,exported:new Date().toISOString(),docs:Object.fromEntries(store)});
  const importObj=o=>{if(!o||o.app!=='surojbek-hamyoni'||typeof o.docs!=='object')throw new Error('bad');
    const prev=store;store=new Map(Object.entries(o.docs));try{commit();}catch(e){store=prev;throw e;}};
  return {api:{doc:docRef,collection:colRef},empty:()=>store.size===0,exportObj,importObj,BK};
})();

const readJSONFile=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{try{ok(JSON.parse(r.result))}catch(e){no(e)}};r.onerror=no;r.readAsText(f);});
const pickFile=()=>new Promise(ok=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';
  i.style.display='none';i.onchange=()=>{ok(i.files&&i.files[0]);i.remove();};document.body.appendChild(i);i.click();});

/* birinchi ochilishda: ma'lumotlarni fayldan yuklash yoki bo'sh boshlash */
function onboarding(){
  return new Promise(resolve=>{
    const o=document.createElement('div');o.className='onb';
    o.innerHTML=`<div class="onb-c"><img src="icon-192.png" alt="" width="72" height="72"><h1>Surojbek hamyoni</h1>
      <p>Ma'lumotlar faqat shu telefonda saqlanadi. Boshlash uchun Claude yuborgan <b>.json</b> faylni tanlang.</p>
      <button class="pri" id="onbFile">Faylni tanlash</button><button class="ghost" id="onbEmpty">Bo'sh boshlash</button>
      <p class="onb-err" id="onbErr" hidden></p></div>`;
    document.body.appendChild(o);
    const err=m=>{const e=o.querySelector('#onbErr');e.textContent=m;e.hidden=false;};
    o.querySelector('#onbFile').onclick=async()=>{const f=await pickFile();if(!f)return;
      try{LocalDB.importObj(await readJSONFile(f));o.remove();resolve();}
      catch(e){err("Bu fayl Surojbek hamyonining fayli emas. Claude yuborgan .json faylni tanlang.");}};
    o.querySelector('#onbEmpty').onclick=()=>{o.remove();resolve();};
  });
}
window.claude={use:async n=>{if(n!=='db')return null;if(LocalDB.empty())await onboarding();return LocalDB.api;}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* zaxira: «Tarix» bo'limining oxirida */
function backupHTML(){
  let last=null;try{last=localStorage.getItem(LocalDB.BK)}catch(e){}
  const days=last?Math.floor((Date.now()-Date.parse(last))/864e5):null,warn=days==null||days>14;
  return `<div class="card"><b>Ma'lumotlar zaxirasi</b>
    <div class="mut" style="font-size:12.5px;margin-top:3px">Ma'lumotlar faqat shu telefonda saqlanadi. Telefon almashsa yoki ilova o'chib ketsa, zaxiradan tiklaysiz.</div>
    <div style="font-size:12.5px;margin-top:6px;font-weight:600;color:${warn?'var(--danger)':'var(--muted)'}">${last?`Oxirgi zaxira: ${dLabel(last.slice(0,10))}`:"Hali zaxira olinmagan"}</div>
    <div class="row" style="margin-top:12px;gap:8px"><button class="sm pri" data-bk>Zaxira olish</button><button class="sm" data-rs>Zaxiradan tiklash</button></div></div>`;
}
async function doBackup(){
  const name=`hamyon-zaxira-${today()}.json`,txt=JSON.stringify(LocalDB.exportObj());
  const mark=()=>{try{localStorage.setItem(LocalDB.BK,new Date().toISOString())}catch(e){}render();};
  const file=new File([txt],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});mark();toast("Zaxira olindi");}catch(e){if(e&&e.name!=='AbortError')toast("Zaxira olinmadi");}
    return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);mark();toast("Zaxira olindi");
}
async function doRestore(){
  const f=await pickFile();if(!f)return;let o;
  try{o=await readJSONFile(f);if(!o||o.app!=='surojbek-hamyoni')throw 0;}catch(e){toast("Bu fayl hamyon zaxirasi emas");return;}
  const n=Object.keys(o.docs||{}).filter(k=>k.startsWith('tx/')).length;
  sheet(`<h2>Zaxiradan tiklash</h2><div class="mut" style="margin-bottom:16px">${o.exported?'Zaxira sanasi: '+dLabel(o.exported.slice(0,10))+', ':''}${n} ta yozuv. Hozirgi ma'lumotlar o'rniga shu qo'yiladi.</div>
    <div class="row" style="gap:8px"><button class="sm" id="no">Bekor qilish</button><span class="sp"></span><button class="sm pri" id="ok">Tiklash</button></div>`,s=>{
    $('#no',s).onclick=closeSheet;
    $('#ok',s).onclick=()=>{try{LocalDB.importObj(o);closeSheet();toast("Tiklandi");}catch(e){toast("Tiklab bo'lmadi");}};
  });
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-bk]'))doBackup();
  else if(e.target.closest('[data-rs]'))doRestore();
});

/* iPhone: barmoq bilan qisib kattalashtirishni to'xtatish (ilova kabi qat'iy o'lchamda tursin) */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
</script>

<body>
<style>
/* Maket: telefon uchun bitta ustun, pastda bo'limlar paneli, o'ngda "+" tugmasi.
   Asosiy g'oya: oylik maosh qayerga bo'linishini ko'rsatadigan "maosh tasmasi". */
:root{
  --bg:#f2f4f1; --card:#ffffff; --ink:#14201a; --muted:#66736c; --line:#e3e8e4; --soft:#eef2ef;
  --accent:#0d7a57; --accent-ink:#ffffff; --accent-soft:#dff2ea;
  --loan:#6a4fb3; --loan-soft:#ece6fa; --spend:#d9822b; --spend-soft:#fbeedd; --save:#1f8fc4; --save-soft:#e0f1fa;
  --danger:#c8443b; --danger-soft:#fbe6e4; --ok:#1d8a4e; --recv:#0b8a80; --recv-soft:#d9f2ef;
  --display:"Unbounded","Onest",system-ui,sans-serif; --text:"Onest","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,32,26,.05),0 6px 18px rgba(20,32,26,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --card:#16211c; --ink:#e6efea; --muted:#93a29a; --line:#25332c; --soft:#1c2923;
  --accent:#3ccb97; --accent-ink:#06261a; --accent-soft:#163a2d;
  --loan:#a68cf0; --loan-soft:#2a2342; --spend:#f0a258; --spend-soft:#3a2a17; --save:#5cc3f2; --save-soft:#16303d;
  --danger:#f07a70; --danger-soft:#3d1e1b; --ok:#5fd393; --recv:#4fd1c5; --recv-soft:#133432; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --card:#16211c; --ink:#e6efea; --muted:#93a29a; --line:#25332c; --soft:#1c2923;
  --accent:#3ccb97; --accent-ink:#06261a; --accent-soft:#163a2d;
  --loan:#a68cf0; --loan-soft:#2a2342; --spend:#f0a258; --spend-soft:#3a2a17; --save:#5cc3f2; --save-soft:#16303d;
  --danger:#f07a70; --danger-soft:#3d1e1b; --ok:#5fd393; --recv:#4fd1c5; --recv-soft:#133432; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--muted)}
button{font:600 14px/1.2 var(--text);color:var(--ink);background:var(--soft);border:none;border-radius:12px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink)}
button.sm{padding:6px 11px;font-size:13px;border-radius:10px;white-space:nowrap;flex:none}
button.ghost{background:transparent;color:var(--muted)}
button.danger{background:var(--danger-soft);color:var(--danger)}
input,select{font:500 16px/1.3 var(--text);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:6px 2px 0}
.sec-h h2{font:600 16px/1.3 var(--text)}
.sec-h .sp+*{font-size:13px}

/* sarlavha */
.top{display:flex;align-items:center;gap:12px;padding:4px 2px 2px}
.top h1{font:700 20px/1.15 var(--display);letter-spacing:-.01em}
.top small{display:block;font:500 13px var(--text);color:var(--muted);margin-top:3px;letter-spacing:0}
.mp{display:flex;align-items:center;gap:2px;margin-left:auto;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.mp button{background:none;padding:6px 10px;font-size:17px;color:var(--muted)}
.mp span{font-weight:600;min-width:96px;text-align:center;font-size:14px}

/* maosh tasmasi */
.salary .big{font:700 30px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 2px}
.debt .big{font:700 30px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 3px;color:var(--loan)}
.salary .big small{font:500 14px var(--text);color:var(--muted);letter-spacing:0;margin-left:6px}
.band{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--soft);margin:12px 0 12px}
.band i{display:block;height:100%}
.band i+i{box-shadow:-2px 0 0 var(--card)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.lg{display:flex;flex-direction:column;gap:1px;min-width:0}
.lg span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.lg span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.lg b{font-weight:700;font-size:15px}
.note{border-radius:14px;padding:11px 13px;font-size:13.5px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--spend-soft)}
.note.bad{background:var(--danger-soft)}

/* to'lovlar ro'yxati */
.pay{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.pay:first-child{border-top:none;padding-top:2px}
.date{width:46px;height:50px;border-radius:12px;background:var(--loan-soft);color:var(--loan);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.date b{font:700 17px var(--display)}
.date span{font-size:11px;font-weight:600;margin-top:3px}
.date.late{background:var(--danger-soft);color:var(--danger)}
.pay .t{flex:1;min-width:0}
.pay .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay .t span{font-size:12.5px;color:var(--muted)}
.pay .a{text-align:right}
.pay .a b{display:block}

/* maqsad */
.goal .bar{height:12px;border-radius:7px;background:var(--soft);overflow:hidden;margin:10px 0 6px}

<script>
'use strict';
/* ---------- yordamchilar ---------- */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const curMonth=()=>today().slice(0,7);
const MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const MS=['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
const monthName=m=>{const s=MON[+m.slice(5)-1];return s[0].toUpperCase()+s.slice(1)+' '+m.slice(0,4);};
const addMonth=(m,k)=>{let y=+m.slice(0,4),mm=+m.slice(5)+k;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+pad(mm);};
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const r0=n=>Math.round(+n||0);
const fmt=n=>{n=r0(n);const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (n<0?'−':'')+s;};
const som=n=>fmt(n)+' so\'m';
const short=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,'').replace('.',',')+' mln';if(a>=1e3)return s+Math.round(a/1e3)+' ming';return s+Math.round(a);};
const parseAmt=s=>{s=String(s||'').replace(/[\s ]/g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?Math.round(v):0;};
const dLabel=d=>{if(!d)return "muddati yo'q";const t=today();if(d===t)return 'bugun';if(d===iso(new Date(Date.now()+864e5)))return 'ertaga';return +d.slice(8)+'-'+MON[+d.slice(5,7)-1]+(d.slice(0,4)!==t.slice(0,4)?' '+d.slice(0,4):'');};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){$$('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

/* ---------- holat ---------- */
const DEF_CATS=[
  {id:'food',name:"Oziq-ovqat",limit:2000000,c:'#2f9e6a'},
  {id:'home',name:"Uy va kommunal",limit:500000,c:'#3a7bd5'},
  {id:'trans',name:"Transport",limit:500000,c:'#d9822b'},
  {id:'comm',name:"Telefon va internet",limit:0,c:'#7a62c9'},
  {id:'health',name:"Dori-darmon",limit:0,c:'#d1495b'},
  {id:'cloth',name:"Kiyim",limit:0,c:'#b5651d'},
  {id:'event',name:"To'y-ma'raka, sovg'a",limit:200000,c:'#c2569a'},
  {id:'other',name:"Boshqa",limit:300000,c:'#7d8a83'}];
const S={db:null,cfg:null,loans:[],tx:[],recv:[],tab:'home',month:curMonth(),open:{},showDone:false,ready:{cfg:false,loans:false,tx:false,recv:false},stale:false,err:''};
const cats=()=>(S.cfg&&S.cfg.cats)||DEF_CATS;
const catOf=id=>id==='kredit'?{id:'kredit',name:"Kredit va qarz to'lovi",c:'var(--loan)'}:id==='salary'?{id:'salary',name:'Maosh',c:'var(--ok)'}:id==='extra'?{id:'extra',name:"Qo'shimcha daromad",c:'var(--ok)'}:(cats().find(c=>c.id===id)||{id,name:'Boshqa',c:'#7d8a83'});
const goals=()=>(S.cfg&&S.cfg.goals)||[{id:'summer',name:'Yozga zaxira',target:5000000,by:'2027-06-30'}];
const income=()=>(S.cfg&&+S.cfg.income)||7000000;

/* ---------- hisob-kitob ---------- */
const inMonth=(t,m)=>t.d&&t.d.slice(0,7)===m;
function monthStats(m){
  const L=S.tx.filter(t=>inMonth(t,m));
  const inc=L.filter(t=>t.t==='in').reduce((s,t)=>s+t.a,0);
  const intPaid=L.reduce((s,t)=>s+fiOf(t),0);
  const spent=L.filter(t=>t.t==='out'&&t.cat!=='kredit').reduce((s,t)=>s+t.a,0)+intPaid;
  const loanPaid=L.filter(t=>t.t==='out'&&t.cat==='kredit').reduce((s,t)=>s+t.a-fiOf(t),0);
  const saved=L.filter(t=>t.t==='save').reduce((s,t)=>s+t.a,0)-L.filter(t=>t.t==='unsave').reduce((s,t)=>s+t.a,0);
  // sched: asosiy qarz qismi; foiz qismi to'langanda xarajatga («Foizlar») o'tadi
  const has=new Set(S.tx.filter(t=>t.loanId).map(t=>t.loanId+':'+t.idx));
  let sched=0,schedLeft=0,intDue=0,intOff=0;
  for(const l of S.loans)(l.schedule||[]).forEach((r,i)=>{if(!(r.d&&r.d.slice(0,7)===m))return;const ri=rowInt(l,r);
    sched+=r.a-ri;if(!r.paid){schedLeft+=r.a;intDue+=ri;}if(!has.has(l.id+':'+i))intOff+=ri;});
  return {inc,spent,loanPaid,saved,sched,schedLeft,intPaid,intDue,intOff};
}
/* to'lovning foiz qismi: bankda jadvaldagi foiz, nasiyada ustamaning teng ulushi */
function rowInt(l,r){
  if(!l||!r)return 0;
  if(r.i!=null)return Math.min(r.a,+r.i||0);
  if(l.kind==='rassrochka'&&l.price){const sc=l.schedule||[],T=sc.reduce((s,x)=>s+x.a,0);return Math.max(0,Math.min(r.a,(T-l.price)/sc.length));}
  return 0;
}
const fiOf=t=>t.t==='out'&&t.cat==='kredit'?(+t.fi||0):0;
function loanInfo(l){
  const sc=l.schedule||[];const total=sc.reduce((s,r)=>s+r.a,0),paid=sc.filter(r=>r.paid).reduce((s,r)=>s+(r.pa||r.a),0);
  const left=sc.filter(r=>!r.paid).reduce((s,r)=>s+r.a,0);const next=sc.filter(r=>!r.paid).sort(byDate)[0];
  const last=sc.filter(r=>r.d).map(r=>r.d).sort().pop();
  // asosiy qarz: to'lovdan foiz yoki ustama qismi olib tashlangani
  const prinAll=sc.reduce((s,r)=>s+r.a-rowInt(l,r),0),prin=sc.filter(r=>!r.paid).reduce((s,r)=>s+r.a-rowInt(l,r),0);
  return {total,paid,left,next,last,prin,prinAll,intLeft:left-prin,nLeft:sc.filter(r=>!r.paid).length,nAll:sc.length};
}
/* foiz va ustama: bankda yillik foiz, nasiyada tovar narxidan ustama va unga teng yillik foiz */
function costInfo(l){
  const sc=l.schedule||[],n=sc.length,T=sc.reduce((s,r)=>s+r.a,0),unpaid=sc.filter(r=>!r.paid);
  if(l.kind==='rassrochka'){
    if(!l.price)return {type:'nasiya'};
    const extra=T-l.price,left=n?extra*unpaid.length/n:0;
    let lo=0,hi=1;
    for(let k=0;k<60;k++){const r=(lo+hi)/2;let pv=0;for(let j=1;j<=n;j++)pv+=sc[j-1].a/Math.pow(1+r,j);if(pv>l.price)lo=r;else hi=r;}
    return {type:'nasiya',base:l.price,extra,left,pct:extra/l.price*100,rate:lo*1200,est:!!l.priceEst};
  }
  if(l.rate){const hasI=sc.some(r=>r.i!=null);
    return {type:'bank',base:l.principal,rate:+l.rate,extra:hasI?sc.reduce((s,r)=>s+(r.i||0),0):null,left:hasI?unpaid.reduce((s,r)=>s+(r.i||0),0):null};}
  return {type:'free',penya:!!l.penya};
}
function costHTML(l){

  if(C.type==='bank')return `<div class="cost"><div><span>Yillik foiz</span><b>${C.rate}%</b></div>${C.base?`<div><span>Olingan summa</span><b class="num">${fmt(C.base)}</b></div>`:''}${C.extra!=null?`<div><span>Foiz jami</span><b class="num">${fmt(Math.round(C.extra))}</b></div><div><span>Foizdan qolgani</span><b class="num">${fmt(Math.round(C.left))}</b></div>`:''}</div>`;

function expectedBal(skip){
  const B=S.cfg&&S.cfg.bal;if(!B)return null;const v={cash:+B.cash||0,card:+B.card||0};
  for(const t of S.tx){if(skip&&t.id===skip)continue;const after=t.d>B.d||(t.d===B.d&&(t.ts||'')>B.at);if(!after)continue;
    if(t.t==='move'){v[wOf(t)]-=t.a;v[t.w2==='cash'?'cash':'card']+=t.a;continue;}
    v[wOf(t)]+=(t.t==='in'||t.t==='unsave'||t.t==='back')?t.a:-t.a;}
  v.cash=Math.round(v.cash*100)/100;v.card=Math.round(v.card*100)/100;v.total=v.cash+v.card;return v;
}

function nextPay(){
  const pays=(S.cfg&&S.cfg.pays)||[],t=new Date(),d=t.getDate();
  if(!pays.length){const e=new Date(t.getFullYear(),t.getMonth()+1,1);return {d:iso(e),known:false};}
  const days=pays.map(p=>+p.day).sort((a,b)=>a-b),nd=days.find(x=>x>d);
  const dt=nd?new Date(t.getFullYear(),t.getMonth(),nd):new Date(t.getFullYear(),t.getMonth()+1,days[0]);
  const p=pays.find(x=>+x.day===dt.getDate());return {d:iso(dt),known:true,a:p?+p.a:0};
}
function runwayNote(){

  let due=0,names=[];
  for(const l of S.loans)for(const r of (l.schedule||[]))if(!r.paid&&r.d&&r.d>=td&&r.d<np.d){due+=r.a;names.push(l.name);}
  const days=Math.max(1,dayDiff(td,np.d)),avail=ev-due,when=np.known?'keyingi maoshgacha ('+dLabel(np.d)+')':'oy oxirigacha';

/* byudjet: xarajat yoki daromad kategoriyalar bo'yicha qanday taqsimlangan (kattasidan kichigiga) */
function distHTML(m){
  const inc=!!S.distIn,by={};
  for(const t of S.tx){if(!inMonth(t,m))continue;
    if(inc){if(t.t==='in')by[t.cat||'extra']=(by[t.cat||'extra']||0)+t.a;}
    else{if(t.t==='out'&&t.cat!=='kredit')by[t.cat]=(by[t.cat]||0)+t.a;const f=fiOf(t);if(f)by.__int=(by.__int||0)+f;}}
  const rows=Object.entries(by).filter(([,v])=>v>=1).map(([id,v])=>{const c=id==='__int'?{name:'Foizlar',c:'var(--danger)'}:catOf(id);return {id,name:c.name,c:c.c,v};}).sort((a,b)=>b.v-a.v);
  const tot=rows.reduce((s,r)=>s+r.v,0),mx=rows.length?rows[0].v:1;
  const pc=v=>{const p=v/tot*100;return p<1?'<1%':Math.round(p)+'%';};
  const seg=`<div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:14px"><button type="button" data-dist="0" class="${inc?'':'on'}">Xarajatlar</button><button type="button" data-dist="1" class="${inc?'on':''}">Daromadlar</button></div>`;
  let body;
  if(!rows.length)body=`<div class="mut" style="font-size:13.5px;padding:6px 0">Bu oyda ${inc?'daromad':'xarajat'} yozilmagan.</div>`;
  else{
    body=`<div class="mut" style="font-size:13px">${monthName(m)}: jami <b class="num" style="color:var(--ink)">${som(Math.round(tot))}</b></div>
      <div class="dist" role="list">${rows.map(r=>`<div class="dist-r" role="listitem" data-catv="${r.id}">
        <div class="row"><span class="dot" style="--c:${r.c}"></span><span class="nm">${esc(r.name)}</span><span class="sp"></span><b class="num">${fmt(Math.round(r.v))}</b><span class="pc num">${pc(r.v)}</span></div>
        ${rows.length>1?`<div class="dbar ${inc?'in':''}"><i style="width:${Math.max(1.5,r.v/mx*100)}%"></i></div>`:''}</div>`).join('')}</div>`;
  }
  return `<div class="card"><b>${inc?'Daromad qayerdan kelgan':'Pul qayerga ketgan'}</b><div style="margin-top:12px">${seg}${body}</div></div>`;
}

function sheet(html,onBind){
  const r=$('#sheetRoot');r.innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;

/* oynani barmoq bilan pastga tortib yopish: oyna tepasida turganda pastga tortilsa ergashadi, yetarlicha tortilsa yopiladi */
function swipeClose(el,bg){
  let y0=null,dy=0,t0=0,drag=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||e.target.closest('input,select,textarea')){y0=null;return;}
    if(el.scrollTop>0&&!e.target.closest('.grab')){y0=null;return;}
    y0=e.touches[0].clientY;dy=0;t0=Date.now();drag=false;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(y0==null)return;dy=e.touches[0].clientY-y0;
    if(!drag){if(dy>6&&el.scrollTop<=0)drag=true;else if(dy<-4){y0=null;return;}else return;}
    e.preventDefault();
    const d=Math.max(0,dy);el.style.transition='none';el.style.transform=`translateY(${d}px)`;
    bg.style.backgroundColor=`rgba(10,18,14,${Math.max(0,.45*(1-d/400))})`;
  },{passive:false});
  const end=()=>{
    if(y0==null)return;y0=null;if(!drag)return;drag=false;
    const v=dy/Math.max(1,Date.now()-t0);
    el.style.transition='transform .2s ease';
    if(dy>90||(v>0.35&&dy>25)){el.style.transform='translateY(110%)';bg.style.transition='background-color .2s';bg.style.backgroundColor='rgba(10,18,14,0)';setTimeout(()=>{if(el.isConnected)closeSheet();},190);}
    else{el.style.transform='';bg.style.backgroundColor='';}
  };
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
}
function closeSheet(){$('#sheetRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* tasdiqlash oynasi: ochiq oynaning ustida chiqadi, kiritilgan ma'lumotlar saqlanib qoladi */
function confirmBox(html){
  return new Promise(res=>{
    const el=document.createElement('div');el.className='cbox-bg';
    el.innerHTML=`<div class="cbox" role="alertdialog" aria-modal="true" aria-labelledby="cbT">${html}</div>`;
    document.body.appendChild(el);
    const done=v=>{el.remove();document.removeEventListener('keydown',esc1,true);res(v);};
    const esc1=e=>{if(e.key==='Escape'){e.stopPropagation();done(false);}};
    document.addEventListener('keydown',esc1,true);
    $('[data-c="no"]',el).onclick=()=>done(false);$('[data-c="yes"]',el).onclick=()=>done(true);
    el.onclick=e=>{if(e.target===el)done(false);};
    setTimeout(()=>$('[data-c="no"]',el).focus(),30);
  });
}
/* chiqim hamyondagi qoldiqdan oshsa ogohlantirish; «Xabarim bor» bosilsa davom etadi */
async function fundsOk(w,a,skip,d){
  // skip: tahrirlanayotgan yozuv (eski holati hisobga olinmaydi); d: yozuv sanasi
  const B=S.cfg&&S.cfg.bal;if(B&&d&&d<B.d)return true; // qoldiq tekshiruvidan oldingi sana qoldiqqa ta'sir qilmaydi
  const ev=expectedBal(skip);if(!ev)return true;
  const have=ev[w];if(a<=have+0.5)return true;
  const o=w==='cash'?'card':'cash';
  return confirmBox(`<div class="cbox-ic" aria-hidden="true">!</div><h2 id="cbT">Hamyonda mablag' yetarli emas</h2>
    <p>«${WN[w]}» hamyonidagi qoldiq <b class="num">${som(have)}</b>, kiritilayotgan chiqim esa <b class="num">${som(a)}</b>.
      Yozuv saqlansa, hamyon qoldig'i <b class="num neg">${som(have-a)}</b> bo'ladi.</p>
    <p class="mut">Bunday holat odatda kirim yozilmagani, summa xato kiritilgani yoki hamyon noto'g'ri tanlangani sababli yuzaga keladi. Iltimos, ma'lumotlarni tekshiring.${ev[o]>=a?` «${WN[o]}» hamyonida ${som(ev[o])} mavjud.`:''}</p>
    <button class="pri" data-c="no">Ortga qaytish</button><button class="ghost" data-c="yes">Xabarim bor, saqlansin</button>`);
}
async function write(fn,okMsg){
  if(!S.db){toast("Saqlab bo'lmadi: ombor ulanmagan");return false;}

      <button class="pri" id="ok" style="width:100%;padding:14px">Saqlash</button>`,s=>{

      const us=$('[data-unsave]',s);if(us)us.onclick=()=>{t=t==='unsave'?'save':'unsave';us.classList.toggle('on',t==='unsave');};
      bindWSel(s,x=>{w=x;});
      $('#ok',s).onclick=async()=>{
        const v=parseAmt(a.value);if(!v){a.focus();toast('Summani kiriting');return;}
        rememberW(w);
        // tahrirda faqat oldingisidan ortiqcha chiqim tekshiriladi

          if(t==='out'&&!ed){const c=cats().find(x=>x.id===cat);if(c&&c.limit){const sp=S.tx.filter(x=>x.t==='out'&&x.cat===cat&&inMonth(x,doc.d.slice(0,7))).reduce((s2,x)=>s2+x.a,0)+v;if(sp>c.limit)setTimeout(()=>toast(`«${c.name}» oylik chegarasidan oshdi`),2500);}}}

/* tarixdagi yozuvni tahrirlash: oddiy yozuvlar to'liq oynada, bog'langanlari (kredit, qarz, o'tkazma) qisqa oynada */
function editTx(tid){
  const t=S.tx.find(x=>x.id===tid);if(!t)return;
  if(t.t==='lend'&&t.recvId&&S.recv.some(r=>r.id===t.recvId))return recvSheet(t.recvId);
  if(!t.loanId&&!t.recvId&&['out','in','save','unsave'].includes(t.t))return addSheet(t.t,t.goal,t);
  const mv=t.t==='move',l=t.loanId?S.loans.find(x=>x.id===t.loanId):null,row=l&&l.schedule?l.schedule[t.idx]:null;
  let w=mv?t.w:wOf(t);
  const title=mv?"O'tkazmani tahrirlash":l?"Kredit to'lovini tahrirlash":t.t==='back'?"Qaytgan qarzni tahrirlash":"Yozuvni tahrirlash";
  sheet(`<h2>${title}</h2>${l?`<div class="mut" style="margin-bottom:12px">${esc(l.name)}${row&&row.d?', jadvaldagi sana '+dLabel(row.d):''}</div>`:''}
    <label class="f">Summa<input id="ea" class="num" inputmode="numeric" value="${fmt(t.a)}"></label>
    <div style="margin-top:12px">${mv?`<div class="wsel"><button type="button" data-f="card" class="card ${w==='card'?'on':''}">${W_SVG.card} → ${W_SVG.cash}</button><button type="button" data-f="cash" class="cash ${w==='cash'?'on':''}">${W_SVG.cash} → ${W_SVG.card}</button></div>`
      :wSel(w,t.t==='in'||t.t==='back'?'Qaysi hamyonga':'Qaysi puldan')}</div>
    <div class="row" style="gap:10px;margin-top:12px"><label class="f" style="flex:1">Sana<input type="date" id="ed" value="${t.d}"></label>${l?'':`<label class="f" style="flex:1.4">Izoh<input id="en" value="${esc(t.note||'')}" placeholder="ixtiyoriy"></label>`}</div>
    <div class="mut" id="efi" style="font-size:12.5px;margin-top:10px"></div>
    <button class="pri" id="ok" style="width:100%;padding:14px;margin-top:14px">Saqlash</button>`,s=>{
    const ea=$('#ea',s),ri=l&&row?rowInt(l,row):0;
    const upd=()=>{const v=parseAmt(ea.value)||0,fi=Math.round(Math.min(ri,v));$('#efi',s).innerHTML=l&&fi?`Shundan foiz: <b style="color:var(--ink)">${fmt(fi)}</b>, asosiy qarzga: <b style="color:var(--ink)">${fmt(v-fi)}</b>. Jadvaldagi to'lov ham shunga o'zgaradi.`:'';};
    ea.addEventListener('input',()=>{const v=parseAmt(ea.value);ea.value=v?fmt(v):'';upd();});upd();
    if(mv)$$('[data-f]',s).forEach(b=>b.onclick=()=>{w=b.dataset.f;$$('[data-f]',s).forEach(x=>x.classList.toggle('on',x===b));});
    else bindWSel(s,x=>{w=x;});
    $('#ok',s).onclick=async()=>{
      const v=parseAmt(ea.value);if(!v){ea.focus();toast('Summani kiriting');return;}
      const d=$('#ed',s).value||t.d,n=$('#en',s)?$('#en',s).value.trim():t.note;
      const out=t.t!=='in'&&t.t!=='back';
      if(out&&!(await fundsOk(w,v,t.id,d)))return;
      const u={...t,a:v,d,note:n};delete u.id;
      if(mv){u.w=w;u.w2=w==='card'?'cash':'card';}else u.w=w;
      if(l)u.fi=Math.round(Math.min(ri,v));
      $('#ok',s).disabled=true;
      const ok=await write(async()=>{
        await S.db.doc('tx/'+t.id).set(u);
        if(l&&row){const sc=l.schedule.map((x,k)=>k===t.idx?{...x,pa:v,pd:d}:x);await S.db.doc('loans/'+l.id).update({schedule:sc});}
        const r=t.recvId?S.recv.find(x=>x.id===t.recvId):null;
        if(r&&(t.t==='in'||t.t==='back')){
          const got=[...(r.got||[])],k=got.findIndex(g=>g.d===t.d&&Math.abs(g.a-t.a)<1);
          if(k>=0){got[k]={...got[k],a:v,d,w};const ur={...r,got};delete ur.id;
            if(recvLeft(ur)<=0){ur.done=true;ur.doneAt=ur.doneAt||new Date().toISOString();}else{ur.done=false;delete ur.doneAt;}
            await S.db.doc('recv/'+r.id).set(ur);}
        }
      },"O'zgartirildi");
      if(ok)closeSheet();else $('#ok',s).disabled=false;
    };
  });
}

function unpaySheet(id,i){
  const l=S.loans.find(x=>x.id===id),r=l.schedule[i];
  sheet(`<h2>Belgini olib tashlash</h2><div class="mut" style="margin-bottom:16px">${esc(l.name)}, ${r.d?dLabel(r.d):''}: ${som(r.pa||r.a)} to'lanmagan deb belgilansinmi? Tarixdagi yozuvi ham o'chadi.</div>

    $('#ok',s).onclick=async()=>{

      const ok=await write(async()=>{await S.db.doc('loans/'+id).update({schedule:sc});const t=S.tx.find(x=>x.loanId===id&&x.idx===i);if(t)await S.db.doc('tx/'+t.id).delete();},'Olib tashlandi');
      if(ok)closeSheet();

function txSheet(tid){
  const t=S.tx.find(x=>x.id===tid);if(!t)return;
  sheet(`<h2>Yozuv</h2><div style="margin-bottom:6px"><b class="num" style="font-size:22px">${som(t.a)}</b></div>
    <div class="mut" style="margin-bottom:16px">${esc(t.t==='move'?(t.w==='cash'?'Naqddan kartaga':'Kartadan naqdga'):t.t==='save'||t.t==='unsave'?"Jamg'arma":t.t==='lend'?'Qarzga berildi':t.t==='back'?'Qarz qaytdi':catOf(t.cat).name)}${t.t==='move'?'':', '+WN[wOf(t)]}, ${dLabel(t.d)}${t.note?'. '+esc(t.note):''}</div>
    ${t.t==='lend'?`<div class="note warn" style="margin-bottom:14px">Bu yozuv «Olinadigan pullar» bilan bog'liq. O'chirsangiz, berilgan pul hamyonga qaytadi va u yerda «Pul chiqmadi» deb belgilanadi.</div>`:''}
    ${t.loanId?`<div class="note warn" style="margin-bottom:14px">Bu kredit to'lovi. Summa, sana yoki hamyonni o'zgartirish mumkin. O'chirish uchun «Qarzlar» bo'limidagi to'lov jadvalidan belgini olib tashlang.</div>`:''}
    <button class="pri" id="edt" style="width:100%;padding:14px;margin-bottom:10px">Tahrirlash</button>
    ${t.loanId?`<button id="no" style="width:100%">Yopish</button>`
      :`<div class="row"><button id="no" style="flex:1">Yopish</button><button class="danger" id="del" style="flex:1">O'chirish</button></div>`}`,s=>{
    $('#no',s).onclick=closeSheet;
    $('#edt',s).onclick=()=>editTx(tid);
    const d=$('#del',s);if(d)d.onclick=async()=>{
      const r=t.recvId?S.recv.find(x=>x.id===t.recvId):null;
      if(await write(async()=>{
        await S.db.doc('tx/'+tid).delete();
        if(!r)return;
        if(t.t==='lend'){const u={...r,lent:false};delete u.id;delete u.lw;await S.db.doc('recv/'+r.id).set(u);return;}
        // olingan pul yozuvi o'chirilsa, olinadigan pul ro'yxatiga qaytadi
        const got=[...(r.got||[])],k=got.findIndex(g=>g.d===t.d&&Math.abs(g.a-t.a)<1);if(k<0)return;got.splice(k,1);
        const u={...r,got};delete u.id;if(recvLeft(u)>0){u.done=false;delete u.doneAt;}await S.db.doc('recv/'+r.id).set(u);
      },"O'chirildi"))closeSheet();};
  });
}
/* bosh oyna: naqd yoki karta bo'yicha yozuvlar (kirim va chiqim shu hamyonga nisbatan) */
function walletSheet(k){
  const mEnd=mm=>{const [y,n]=mm.split('-').map(Number);return iso(new Date(y,n,0));};
  const m=curMonth(),pm=addMonth(m,-1);
  const P=[['m','Shu oy',m+'-01',mEnd(m)],['pm',"O'tgan oy",pm+'-01',mEnd(pm)],['3m','Oxirgi 3 oy',addMonth(m,-2)+'-01',mEnd(m)],['all','Barchasi','2000-01-01','2999-12-31']];
  let from=P[0][2],to=P[0][3];
  const dP=d=>+d.slice(8)+'-'+MON[+d.slice(5,7)-1]+' '+d.slice(0,4);
  // yozuvning shu hamyonga ta'siri: + kirim, − chiqim, 0 aloqasi yo'q
  const eff=t=>{if(t.t==='move'){if(t.w===k)return -t.a;if((t.w2||(t.w==='cash'?'card':'cash'))===k)return t.a;return 0;}
    if(wOf(t)!==k)return 0;return (t.t==='in'||t.t==='unsave'||t.t==='back')?t.a:-t.a;};
  const row=(t,v)=>txRow(t).replace(/<b class="num [^"]*">[^<]*<\/b><\/div>\s*$/,`<b class="num ${v>0?'amt-in':'amt-out'}">${v>0?'+':'−'} ${fmt(Math.abs(v))}</b></div>`);
  const list=()=>{
    const a=from<=to?from:to,b=from<=to?to:from;
    const L=S.tx.filter(t=>t.d&&t.d>=a&&t.d<=b&&eff(t)).sort((p,q)=>(q.d+(q.ts||'')).localeCompare(p.d+(p.ts||'')));
    const inS=L.reduce((s2,t)=>s2+Math.max(0,eff(t)),0),outS=L.reduce((s2,t)=>s2+Math.max(0,-eff(t)),0);
    const lbl=a==='2000-01-01'?'Barcha yozuvlar':a.slice(8)==='01'&&b===mEnd(a.slice(0,7))?monthName(a.slice(0,7)):`${dP(a)} — ${dP(b)}`;
    const days=[...new Set(L.map(t=>t.d))];
    const body=days.map(d=>{const X=L.filter(t=>t.d===d);return `<div class="day-h" style="margin:14px 0 2px">${dLabel(d)}</div>`+X.map(t=>row(t,eff(t))).join('');}).join('');
    return `<div class="mut" style="margin-top:14px">${lbl}: ${L.length} ta yozuv</div>
      <div class="wsum"><div><span class="mut">Kirim</span><b class="num amt-in">+ ${fmt(Math.round(inS))}</b></div><div><span class="mut">Chiqim</span><b class="num">− ${fmt(Math.round(outS))}</b></div></div>`
      +(L.length?body:`<div class="empty">Bu davrda ${WN[k].toLowerCase()} bo'yicha yozuv yo'q</div>`);
  };
  const ev=expectedBal();
  sheet(`<div class="row" style="gap:10px;margin-bottom:4px"><span class="wlogo">${W_SVG[k]}</span><h2 style="margin:0">${WN[k]}</h2></div>
    <div class="mut" style="margin-bottom:12px">Hozirgi qoldiq: <b class="num" style="color:${ev&&ev[k]<0?'var(--danger)':'var(--ink)'}">${ev?som(ev[k]):'—'}</b></div>
    <div class="chips">${P.map(p=>`<button type="button" class="chip" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>
    <div class="range"><label for="pf">Dan</label><input type="date" id="pf"><label for="pt">Gacha</label><input type="date" id="pt"></div>
    <div id="cl"></div>
    <button id="no" style="width:100%;margin-top:14px">Yopish</button>`,s=>{
    const upd=()=>{
      $('#pf',s).value=from==='2000-01-01'?'':from;$('#pt',s).value=to==='2999-12-31'?'':to;
      $$('[data-p]',s).forEach(b=>{const p=P.find(x=>x[0]===b.dataset.p);b.classList.toggle('on',p[2]===from&&p[3]===to);});
      $('#cl',s).innerHTML=list();
      $$('#cl [data-tx]',s).forEach(r=>r.onclick=()=>txSheet(r.dataset.tx));
    };
    $$('[data-p]',s).forEach(b=>b.onclick=()=>{const p=P.find(x=>x[0]===b.dataset.p);from=p[2];to=p[3];upd();});
    $('#pf',s).addEventListener('change',e=>{if(e.target.value){from=e.target.value;if(to==='2999-12-31')to=today();upd();}});
    $('#pt',s).addEventListener('change',e=>{if(e.target.value){to=e.target.value;if(from==='2000-01-01')from=to.slice(0,7)+'-01';upd();}});
    $('#no',s).onclick=closeSheet;
    upd();
  });
}
/* byudjet: kategoriya bo'yicha shu oydagi yozuvlar */
function catSheet(cid){
  const isInt=cid==='__int',isIn=cid==='salary'||cid==='extra',c=isInt?{name:'Foizlar',c:'var(--danger)'}:catOf(cid);
  const mEnd=mm=>{const [y,k]=mm.split('-').map(Number);return iso(new Date(y,k,0));};
  const m=S.month,y=m.slice(0,4),pm=addMonth(m,-1);
  // tayyor davrlar: byudjetda ochiq turgan oyga nisbatan
  const P=[['m','Shu oy',m+'-01',mEnd(m)],['pm',"O'tgan oy",pm+'-01',mEnd(pm)],['3m','Oxirgi 3 oy',addMonth(m,-2)+'-01',mEnd(m)],['y',`${y}-yil`,y+'-01-01',y+'-12-31']];
  let from=P[0][2],to=P[0][3];
  const val=t=>isInt?fiOf(t):t.a;
  const dP=d=>+d.slice(8)+'-'+MON[+d.slice(5,7)-1]+' '+d.slice(0,4);
  const row=t=>`<div class="tx" data-tx="${t.id}"><div class="ic" style="--c:${c.c}">${esc(c.name[0])}</div>
    <div class="t"><b>${esc(t.note||c.name)}</b><span><span class="wtag ${wOf(t)}">${WN[wOf(t)]}</span>${dLabel(t.d)}${isInt?`, to'lov ${fmt(t.a)}`:''}</span></div>
    <b class="num ${isIn?'amt-in':'amt-out'}">${isIn?'+':'−'} ${fmt(Math.round(val(t)))}</b></div>`;
  const list=()=>{
    const a=from<=to?from:to,b=from<=to?to:from;
    const L=S.tx.filter(t=>t.d&&t.d>=a&&t.d<=b&&(isInt?fiOf(t)>0:isIn?(t.t==='in'&&(t.cat||'extra')===cid):(t.t==='out'&&t.cat===cid)))
      .sort((p,q)=>(q.d+(q.ts||'')).localeCompare(p.d+(p.ts||'')));
    const sum=X=>Math.round(X.reduce((s,t)=>s+val(t),0));
    const lbl=a.slice(8)==='01'&&b===mEnd(a.slice(0,7))?monthName(a.slice(0,7)):`${dP(a)} — ${dP(b)}`;
    const months=[...new Set(L.map(t=>t.d.slice(0,7)))];
    // bir necha oy bo'lsa: har oy alohida, yonida oy jami
    const body=months.length>1?months.map(mm=>{const X=L.filter(t=>t.d.slice(0,7)===mm);
        return `<div class="day-h row" style="margin:14px 0 2px"><span>${monthName(mm)}</span><span class="sp"></span><span class="num">${fmt(sum(X))}</span></div>`+X.map(row).join('');}).join('')
      :L.map(row).join('');
    return `<div class="mut" style="margin:14px 0 4px">${lbl}: ${L.length} ta yozuv, jami <b class="num" style="color:var(--ink)">${som(sum(L))}</b></div>`
      +(L.length?body:`<div class="empty">Bu davrda «${esc(c.name)}» bo'yicha yozuv yo'q</div>`);
  };
  sheet(`<div class="row" style="gap:10px;margin-bottom:12px"><span class="dot" style="--c:${c.c}"></span><h2 style="margin:0">${esc(c.name)}</h2></div>
    <div class="chips">${P.map(p=>`<button type="button" class="chip" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>
    <div class="range"><label for="pf">Dan</label><input type="date" id="pf"><label for="pt">Gacha</label><input type="date" id="pt"></div>
    <div id="cl"></div>
    <button id="no" style="width:100%;margin-top:14px">Yopish</button>`,s=>{
    const upd=()=>{
      $('#pf',s).value=from;$('#pt',s).value=to;
      $$('[data-p]',s).forEach(b=>{const p=P.find(x=>x[0]===b.dataset.p);b.classList.toggle('on',p[2]===from&&p[3]===to);});
      $('#cl',s).innerHTML=list();
      $$('#cl [data-tx]',s).forEach(r=>r.onclick=()=>txSheet(r.dataset.tx));
    };
    $$('[data-p]',s).forEach(b=>b.onclick=()=>{const p=P.find(x=>x[0]===b.dataset.p);from=p[2];to=p[3];upd();});
    $('#pf',s).addEventListener('change',e=>{if(e.target.value){from=e.target.value;upd();}});
    $('#pt',s).addEventListener('change',e=>{if(e.target.value){to=e.target.value;upd();}});
    $('#no',s).onclick=closeSheet;
    upd();
  });
}
function limSheet(cid){
  const list=cats().map(c=>({...c})),c=list.find(x=>x.id===cid);
  sheet(`<h2>${esc(c.name)}</h2><label class="f">Oylik chegara (0 — chegarasiz)<input id="lv" class="num" inputmode="numeric" value="${c.limit?fmt(c.limit):''}" placeholder="0"></label>
    <button class="pri" id="ok" style="width:100%;padding:14px;margin-top:16px">Saqlash</button>`,s=>{
    const v=$('#lv',s);v.addEventListener('input',()=>{const n=parseAmt(v.value);v.value=n?fmt(n):'';});setTimeout(()=>v.focus(),80);
    $('#ok',s).onclick=async()=>{c.limit=parseAmt(v.value);if(await write(()=>S.db.doc('fin/cfg').set({...(S.cfg||{}),cats:list}),'Saqlandi'))closeSheet();};
  });
}
function incSheet(){
  sheet(`<h2>Oylik daromad rejasi</h2><label class="f">Qo'lga tegadigan summa<input id="iv" class="num" inputmode="numeric" value="${fmt(income())}"></label>
    <button class="pri" id="ok" style="width:100%;padding:14px;margin-top:16px">Saqlash</button>`,s=>{
    const v=$('#iv',s);v.addEventListener('input',()=>{const n=parseAmt(v.value);v.value=n?fmt(n):'';});
    $('#ok',s).onclick=async()=>{const n=parseAmt(v.value);if(!n)return;if(await write(()=>S.db.doc('fin/cfg').set({...(S.cfg||{}),income:n}),'Saqlandi'))closeSheet();};
  });
}
function loanSheet(){
  let mode='once';
  const draw=()=>sheet(`<h2>Qarz yoki kredit qo'shish</h2>
    <div class="stack" style="gap:12px">
    <label class="f">Kimdan yoki qaysi bankdan<input id="ln" placeholder="masalan: Akam, Anor bank"></label>
    <label class="f">Qarz summasi<input id="la" class="num" inputmode="numeric" placeholder="0"></label>
    <div class="seg" style="grid-template-columns:1fr 1fr"><button data-m="once" class="${mode==='once'?'on':''}">Bir martada</button><button data-m="monthly" class="${mode==='monthly'?'on':''}">Oyma-oy</button></div>
    ${mode==='once'?`<label class="f">Qaytarish sanasi (bo'lmasa bo'sh qoldiring)<input type="date" id="ld"></label>`
      :`<div class="row" style="gap:10px"><label class="f" style="flex:1">Oyiga<input id="lm" class="num" inputmode="numeric" placeholder="0"></label><label class="f" style="flex:1">Birinchi to'lov<input type="date" id="ld" value="${today()}"></label></div>`}
    <label class="f">Izoh<input id="lnote" placeholder="ixtiyoriy"></label>
    <button class="pri" id="ok" style="padding:14px">Qo'shish</button></div>`,s=>{
    $$('.amt,[inputmode=numeric]',s).forEach(v=>v.addEventListener('input',()=>{const n=parseAmt(v.value);v.value=n?fmt(n):'';}));
    $$('[data-m]',s).forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
    $('#ok',s).onclick=async()=>{
      const name=$('#ln',s).value.trim(),amt=parseAmt($('#la',s).value),d=($('#ld',s)||{}).value||'';
      if(!name||!amt){toast('Ism va summani kiriting');return;}
      let schedule=[];
      if(mode==='once') schedule=[{d,a:amt}];
      else{const mon=parseAmt($('#lm',s).value);if(!mon||!d){toast("Oylik summa va sanani kiriting");return;}
        let left=amt,k=0;while(left>0&&k<240){const dt=new Date(d+'T12:00');dt.setMonth(dt.getMonth()+k);schedule.push({d:iso(dt),a:Math.min(mon,left)});left-=mon;k++;}}
      const id='q'+uid();
      if(await write(()=>S.db.doc('loans/'+id).set({name,kind:'qarz',note:$('#lnote',s).value.trim(),schedule,order:100+S.loans.length}),"Qo'shildi"))closeSheet();
    };
  });
  draw();
}
function cfgSet(patch){return S.db.doc('fin/cfg').set({...(S.cfg||{}),...patch});}
function checkSheet(){
  const ev=expectedBal();
  sheet(`<h2>Pulni tekshirish</h2><div class="mut" style="font-size:13.5px;margin-bottom:14px">Naqd pulni sanang va karta qoldig'ini bank ilovasidan qarang.</div>
    <div class="row" style="gap:10px"><label class="f" style="flex:1"><span class="row" style="gap:6px">${W_SVG.cash}Naqd</span><input id="cc" class="num" inputmode="numeric" placeholder="0"></label><label class="f" style="flex:1"><span class="row" style="gap:6px">${W_SVG.card}Karta</span><input id="cd" class="num" inputmode="decimal" placeholder="0"></label></div>
    <div id="res"></div><button class="pri" id="ok" style="width:100%;padding:14px;margin-top:14px">Tekshirish</button>`,s=>{
    $$('.f svg.logo',s).forEach(x=>{x.style.width='26px';x.style.height='18px';});
    const cc=$('#cc',s);cc.addEventListener('input',()=>{const n=parseAmt(cc.value);cc.value=n?fmt(n):'';});setTimeout(()=>cc.focus(),80);
    const cardVal=()=>{const v=parseFloat(String($('#cd',s).value).replace(/[\s ]/g,'').replace(',','.'));return isFinite(v)?Math.round(v*100)/100:0;};
    const save=async(extras)=>{
      const cash=parseAmt(cc.value),card=cardVal(),now=new Date();
      const ok=await write(async()=>{
        for(const ex of extras) await S.db.collection('tx').doc(uid()).set({...ex,d:today(),ts:new Date(now.getTime()-1000).toISOString()});
        await cfgSet({bal:{cash,card,d:today(),at:now.toISOString()}});
      },'Saqlandi');
      if(ok)closeSheet();
    };
    $('#ok',s).onclick=()=>{
      const act={cash:parseAmt(cc.value),card:cardVal()};
      if(!ev){save([]);return;}
      const diff={cash:Math.round(ev.cash-act.cash),card:Math.round(ev.card-act.card)};
      const lines=[],extras=[];
      for(const k of ['cash','card']){const d=diff[k];if(Math.abs(d)<1000)continue;
        lines.push(d>0?`<div><b>${WN[k]}:</b> yozuvlar bo'yicha ${som(ev[k])}, aslida ${som(act[k])}. <b class="num" style="color:var(--danger)">${som(d)}</b> qayerga ketgani yozilmagan.</div>`
                     :`<div><b>${WN[k]}:</b> yozuvlar bo'yicha ${som(ev[k])}, aslida ${som(act[k])}. <b class="num" style="color:var(--ok)">${som(-d)}</b> ko'p (yozilmagan kirim).</div>`);
        extras.push(d>0?{t:'out',cat:'other',a:d,w:k,note:'Yozilmagan xarajat (tekshiruvda topildi)'}:{t:'in',cat:'extra',a:-d,w:k,note:'Yozilmagan kirim (tekshiruvda topildi)'});}
      if(!lines.length){$('#res',s).innerHTML=`<div class="diff" style="background:var(--accent-soft)">Hammasi to'g'ri: naqd ham, karta ham yozuvlarga mos keldi.</div>`;$('#ok',s).textContent='Saqlash';$('#ok',s).onclick=()=>save([]);return;}
      $('#res',s).innerHTML=`<div class="diff stack" style="background:var(--spend-soft);gap:8px">${lines.join('')}</div><button class="pri" id="w1" style="width:100%;margin-bottom:8px">Farqni yozib qo'yish</button>`;
      $('#ok',s).textContent='Faqat qoldiqni yangilash';$('#ok',s).classList.remove('pri');
      $('#ok',s).onclick=()=>save([]);
      $('#w1',s).onclick=()=>save(extras);
    };
  });
}
function recvSheet(id){
  const r=id?S.recv.find(x=>x.id===id):null;if(id&&!r)return;
  // lent: pulni o'zim berdim (hamyondan chiqadi); aks holda faqat eslatma (masalan, ish haqi)
  let lent=r?!!r.lent:true,w=(r&&r.lw)||lastW;
  sheet(`<h2>${r?'Olinadigan pul':"Yangi olinadigan pul"}</h2><div class="stack" style="gap:12px">
    <label class="f">Kimdan<input id="rn" value="${r?esc(r.name):''}" placeholder="masalan: Akmal, Ishdan"></label>
    <label class="f">Summa<input id="ra" class="num" inputmode="numeric" value="${r?fmt(r.a):''}" placeholder="0"></label>
    <div><div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" data-l="1" class="${lent?'on':''}">Men pul berdim</button><button type="button" data-l="0" class="${lent?'':'on'}">Pul chiqmadi</button></div>
      <div class="mut" id="lhint" style="font-size:12.5px;margin-top:6px"></div>
      <div id="lw" style="margin-top:10px">${wSel(w,'Qaysi puldan berdingiz')}</div></div>
    <div class="row" style="gap:10px"><label class="f" style="flex:1">Qachongacha (ixtiyoriy)<input type="date" id="rd" value="${r&&r.due||''}"></label><label class="f" style="flex:1.3">Izoh<input id="rt" value="${r?esc(r.note||''):''}" placeholder="nima uchun"></label></div>
    ${r&&(r.got||[]).length?`<div class="mut" style="font-size:13px">Olinganlari: ${(r.got||[]).map(g=>`${dLabel(g.d)} — ${fmt(g.a)}`).join(', ')}</div>`:''}
    <button class="pri" id="ok" style="padding:14px">${r?'Saqlash':"Qo'shish"}</button>
    ${r?`<button class="danger" id="del">O'chirish</button>`:''}</div>`,s=>{
    const ra=$('#ra',s);ra.addEventListener('input',()=>{const n=parseAmt(ra.value);ra.value=n?fmt(n):'';});if(!r)setTimeout(()=>$('#rn',s).focus(),80);
    const showL=()=>{$('#lw',s).hidden=!lent;$$('[data-l]',s).forEach(b=>b.classList.toggle('on',(b.dataset.l==='1')===lent));
      $('#lhint',s).textContent=lent?"Summa tanlangan hamyondan ayiriladi, qaytarilganda yana qo'shiladi. Byudjetda xarajat yoki daromad bo'lib hisoblanmaydi."
        :"Masalan, ish haqi yoki boshqa sizga tegishli pul. Hamyon qoldig'i o'zgarmaydi, olinganda daromad bo'lib yoziladi.";};
    $$('[data-l]',s).forEach(b=>b.onclick=()=>{lent=b.dataset.l==='1';showL();});showL();
    bindWSel(s,x=>{w=x;});
    $('#ok',s).onclick=async()=>{const name=$('#rn',s).value.trim(),a=parseAmt(ra.value);if(!name||!a){toast('Kimdan va summani kiriting');return;}
      const rid=r?r.id:uid(),lid='ln-'+rid,old=S.tx.find(x=>x.id===lid),now=new Date().toISOString();
      const body={...(r?{...r}:{created:now,got:[]}),name,a,due:$('#rd',s).value||'',note:$('#rt',s).value.trim(),lent};delete body.id;
      if(lent)body.lw=w;else delete body.lw;
      if(recvLeft(body)<=0){body.done=true;body.doneAt=body.doneAt||now;}else{body.done=false;delete body.doneAt;}
      // hamyondan qancha qo'shimcha chiqadi: yangi berilgan pul yoki oshirilgan summa
      const c0=(body.created||now);
      if(lent&&(!old||old.a!==a||wOf(old)!==w)){rememberW(w);if(!(await fundsOk(w,a,lid,old?old.d:c0.slice(0,10))))return;}
      if(await write(async()=>{
        await S.db.doc('recv/'+rid).set(body);
        if(lent)await S.db.collection('tx').doc(lid).set({t:'lend',a,w,d:old?old.d:c0.slice(0,10),note:name,recvId:rid,ts:old?old.ts:c0});
        else if(old)await S.db.doc('tx/'+lid).delete();
      },r?'Saqlandi':"Qo'shildi"))closeSheet();};
    const d=$('#del',s);if(d)d.onclick=async()=>{if(d.dataset.sure){
        const lt=S.tx.find(x=>x.id==='ln-'+r.id);
        if(await write(async()=>{await S.db.doc('recv/'+r.id).delete();if(lt)await S.db.doc('tx/'+lt.id).delete();},"O'chirildi"))closeSheet();}
      else{d.dataset.sure=1;d.textContent=S.tx.some(x=>x.id==='ln-'+r.id)?"Ha, o'chirilsin (berilgan pul hamyonga qaytadi)":"Ha, o'chirilsin";}};
  });
}
function gotSheet(id){
  const r=S.recv.find(x=>x.id===id);if(!r)return;let w='cash';const left=recvLeft(r);
  sheet(`<h2>Pulni oldingizmi?</h2><div class="mut" style="margin-bottom:12px">${esc(r.name)}${r.note?', '+esc(r.note):''}. Qolgan: ${som(left)}</div>
    <label class="f">Olingan summa<input id="ga" class="num" inputmode="numeric" value="${fmt(left)}"></label>
    <div class="mut" style="font-size:12.5px;margin-top:6px">Bir qismini olgan bo'lsangiz, shuncha summani yozing: qolgani ro'yxatda qoladi.</div>
    <div style="margin-top:12px">${wSel(w,'Qaysi hamyonga')}</div>
    <div class="row" style="margin-top:16px"><button id="no" style="flex:1">Bekor qilish</button><button class="pri" id="ok" style="flex:1">Oldim</button></div>`,s=>{
    const ga=$('#ga',s);ga.addEventListener('input',()=>{const n=parseAmt(ga.value);ga.value=n?fmt(n):'';});
    bindWSel(s,x=>{w=x;});
    $('#no',s).onclick=closeSheet;
    $('#ok',s).onclick=async()=>{const a=Math.min(parseAmt(ga.value)||left,left),now=new Date().toISOString();
      const got=[...(r.got||[]),{d:today(),a,w}],full=a>=left;
      const ok=await write(async()=>{
        await S.db.collection('tx').doc(uid()).set(r.lent?{t:'back',a,w,d:today(),note:r.name+(full?'':' (qisman)'),recvId:r.id,ts:now}
          :{t:'in',cat:'extra',a,w,d:today(),note:r.name+(full?'':' (qisman)'),recvId:r.id,ts:now});
        await S.db.doc('recv/'+r.id).update(full?{got,done:true,doneAt:now}:{got});
      },full?'Hammasi olindi':`${fmt(a)} olindi, ${fmt(left-a)} qoldi`);
      if(ok)closeSheet();};
  });
}
function moveSheet(){
  let from='card';
  const draw=()=>sheet(`<h2>Naqd ↔ Karta</h2><div class="mut" style="font-size:13.5px;margin-bottom:12px">Bankomatdan naqd olsangiz yoki naqdni kartaga solsangiz.</div>
    <div class="wsel" style="margin-bottom:14px"><button type="button" data-f="card" class="${from==='card'?'on card':'card'}">${W_SVG.card} → ${W_SVG.cash}</button><button type="button" data-f="cash" class="${from==='cash'?'on cash':'cash'}">${W_SVG.cash} → ${W_SVG.card}</button></div>
    <div class="mut" style="text-align:center;font-size:13px">${from==='card'?'Kartadan naqdga':"Naqddan kartaga"}</div>
    <input class="amt num" id="amt" inputmode="numeric" placeholder="0" aria-label="Summa">
    <label class="f" style="margin:8px 0 14px">Komissiya (bo'lsa)<input id="fee" class="num" inputmode="numeric" placeholder="0"></label>
    <button class="pri" id="ok" style="width:100%;padding:14px">Saqlash</button>`,s=>{
    $$('[data-f]',s).forEach(b=>b.onclick=()=>{from=b.dataset.f;draw();});
    $$('#amt,#fee',s).forEach(v=>v.addEventListener('input',()=>{const n=parseAmt(v.value);v.value=n?fmt(n):'';}));setTimeout(()=>$('#amt',s).focus(),80);
    $('#ok',s).onclick=async()=>{
      const a=parseAmt($('#amt',s).value),fee=parseAmt($('#fee',s).value);if(!a){toast('Summani kiriting');return;}
      if(!(await fundsOk(from,a+fee,null,today())))return;
      const to=from==='card'?'cash':'card',now=new Date().toISOString();
      const ok=await write(async()=>{await S.db.collection('tx').doc(uid()).set({t:'move',a,w:from,w2:to,d:today(),note:'',ts:now});
        if(fee)await S.db.collection('tx').doc(uid()).set({t:'out',cat:'other',a:fee,w:from,d:today(),note:'Pul yechish komissiyasi',ts:now});},'Saqlandi');
      if(ok)closeSheet();
    };
  });
  draw();
}
function delLoanSheet(id){
  const l=S.loans.find(x=>x.id===id);
  sheet(`<h2>O'chirish</h2><div class="mut" style="margin-bottom:16px">«${esc(l.name)}» ro'yxatdan o'chirilsinmi? Tarixdagi to'lovlar o'chmaydi.</div>
    <div class="row"><button id="no" style="flex:1">Yo'q</button><button class="danger" id="ok" style="flex:1">O'chirish</button></div>`,s=>{
    $('#no',s).onclick=closeSheet;$('#ok',s).onclick=async()=>{if(await write(()=>S.db.doc('loans/'+id).delete(),"O'chirildi"))closeSheet();};
  });
}

/* ---------- ulanish ---------- */
render();
(async()=>{
  let db=null;try{db=window.claude&&await window.claude.use('db');}catch(e){db=null;}
  if(!db){S.err="Ma'lumotlar ombori ochilmadi. Ilovani yopib, qayta oching.";render();return;}
  S.db=db;render();
  const timer=setTimeout(()=>{S.stale=true;render();},10000);
  const done=k=>snap=>{if(!snap.metadata.fromCache){S.ready[k]=true;if(S.ready.cfg&&S.ready.loans&&S.ready.tx&&S.ready.recv){clearTimeout(timer);S.stale=false;}}};
  const fail=e=>{clearTimeout(timer);S.err=e&&e.code==='revoked'?"Kirish huquqi o'zgardi.":"Ma'lumotlarni o'qib bo'lmadi.";S.stale=true;render();};
  db.doc('fin/cfg').onSnapshot(s=>{S.cfg=s.exists?s.data():null;done('cfg')(s);render();},fail);
  db.collection('loans').onSnapshot(s=>{S.loans=s.docs.map(d=>({id:d.id,...d.data()}));done('loans')(s);render();},fail);
  db.collection('tx').onSnapshot(s=>{S.tx=s.docs.map(d=>({id:d.id,...d.data()}));done('tx')(s);render();},fail);
  db.collection('recv').onSnapshot(s=>{S.recv=s.docs.map(d=>({id:d.id,...d.data()}));done('recv')(s);render();},fail);
})();
</script>
